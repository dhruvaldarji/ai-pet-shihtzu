name: Pull request policy
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pr-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const conventional = /^[a-z][a-z0-9-]*(?:\([^()\r\n]+\))?!?: \S[^\r\n]*$/;
            const validSha = value => typeof value === 'string' && /^[a-f0-9]{40}$/.test(value);
            try {
              const pr = context.payload.pull_request;
              if (
                typeof pr?.title !== 'string' ||
                !conventional.test(pr.title) ||
                !validSha(pr?.base?.sha) ||
                !validSha(pr?.head?.sha)
              ) throw new Error();
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo,
                basehead: `${pr.base.sha}...${pr.head.sha}`,
                per_page: 2,
              });
              if (
                comparison.data.total_commits !== 1 ||
                !Array.isArray(comparison.data.commits) ||
                comparison.data.commits.length !== 1
              ) throw new Error();
              const [commit] = comparison.data.commits;
              const subject = typeof commit.commit?.message === 'string' ? commit.commit.message.split('\n')[0] : '';
              if (
                commit.sha !== pr.head.sha ||
                !conventional.test(subject) ||
                !Array.isArray(commit.parents) ||
                commit.parents.length !== 1
              ) throw new Error();
              core.info('PR policy passed');
            } catch {
              core.setFailed('PR policy validation failed');
            }
