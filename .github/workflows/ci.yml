name: Source and package checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install verified WebP tools
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 --output libwebp.tar.gz https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.6.0-linux-x86-64.tar.gz
          echo '1c5ffab71efecefa0e3c23516c3a3a1dccb45cc310ae1095c6f14ae268e38067  libwebp.tar.gz' | sha256sum --check --strict
          tar -xzf libwebp.tar.gz
          echo "$RUNNER_TEMP/libwebp-1.6.0-linux-x86-64/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run check:setup
      - run: bun test tools --timeout 30000
      - run: bun audit --audit-level=high
