name: Manual release preparation
on:
  workflow_dispatch:
    inputs:
      source:
        description: Full main-reachable source commit SHA
        required: true
        type: string
      version:
        description: Stable version such as v1.2.3
        required: true
        type: string
      mode:
        description: Dry-run prepares a short-lived artifact; draft requires owner approval
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - draft
permissions:
  contents: read
concurrency:
  group: release-operations
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'dhruvaldarji/ai-pet-shihtzu' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.inputs.outputs.source }}
      version: ${{ steps.inputs.outputs.version }}
      mode: ${{ steps.inputs.outputs.mode }}
    steps:
      - id: inputs
        name: Validate dispatch context and inputs
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SOURCE: ${{ inputs.source }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_EVENT" == workflow_dispatch ]] || { echo "Invalid release event" >&2; exit 1; }
          [[ "$RELEASE_REPOSITORY" == dhruvaldarji/ai-pet-shihtzu ]] || { echo "Invalid release repository" >&2; exit 1; }
          [[ "$RELEASE_REF" == refs/heads/main ]] || { echo "Release workflow must use main" >&2; exit 1; }
          [[ "$RELEASE_SOURCE" =~ ^[a-f0-9]{40}$ ]] || { echo "Invalid source SHA" >&2; exit 1; }
          [[ "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Invalid stable version" >&2; exit 1; }
          [[ "$RELEASE_MODE" == dry-run || "$RELEASE_MODE" == draft ]] || { echo "Invalid release mode" >&2; exit 1; }
          {
            printf 'source=%s\n' "$RELEASE_SOURCE"
            printf 'version=%s\n' "$RELEASE_VERSION"
            printf 'mode=%s\n' "$RELEASE_MODE"
          } >> "$GITHUB_OUTPUT"
  build:
    needs: validate
    if: needs.validate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.validate.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Verify selected source is on main
        env:
          RELEASE_SOURCE: ${{ needs.validate.outputs.source }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet refs/remotes/origin/main
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SOURCE" ]]
          git merge-base --is-ancestor "$RELEASE_SOURCE" refs/remotes/origin/main
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
      - run: bun install --frozen-lockfile
      - run: bun run setup:quality
      - run: bun run check:quality
      - run: bun run setup:security
      - run: bun run check:security-history
      - run: bun run check:security
      - run: bun test tools --timeout 30000
      - run: bun run check:production
      - run: bun run check:dependencies
      - name: Prepare immutable release artifacts
        env:
          RELEASE_SOURCE: ${{ needs.validate.outputs.source }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: bun run release:prepare -- --version "$RELEASE_VERSION" --source "$RELEASE_SOURCE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-output
          path: |
            dist/releases/${{ needs.validate.outputs.version }}/
            dist/releases/latest.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
  draft:
    needs: [validate, build]
    if: needs.validate.result == 'success' && needs.build.result == 'success' && needs.validate.outputs.mode == 'draft'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: release-approval
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.validate.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Verify selected source is on main
        env:
          RELEASE_SOURCE: ${{ needs.validate.outputs.source }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet refs/remotes/origin/main
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SOURCE" ]]
          git merge-base --is-ancestor "$RELEASE_SOURCE" refs/remotes/origin/main
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-output
          path: ${{ runner.temp }}/release-artifact
      - name: Create or resume an unpublished draft
        env:
          RELEASE_SOURCE: ${{ needs.validate.outputs.source }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run release:draft -- --version "$RELEASE_VERSION" --source "$RELEASE_SOURCE" --directory "$RUNNER_TEMP/release-artifact/$RELEASE_VERSION"
